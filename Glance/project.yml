name: Glance
options:
  bundleIdPrefix: com.glance
  deploymentTarget:
    macOS: "12.3"
  xcodeVersion: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "12.3"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"

# Swift Package Manager 依赖配置
packages:
  # 语法高亮（highlight.js 封装，离线可用），用于可编辑代码视图。
  Highlightr:
    url: https://github.com/raspu/Highlightr
    from: "2.1.0"

targets:
  Glance:
    type: application
    platform: macOS
    sources:
      - Sources
    resources:
      - Resources
    dependencies:
      - package: Highlightr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glance.app
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: Glance
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
    entitlements:
      path: Glance.entitlements
      properties:
        com.apple.security.get-task-allow: true