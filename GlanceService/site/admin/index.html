<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Glance Ops Console</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#14211f;background:#f3f7f6;--ink:#14211f;--muted:#657470;--line:#d8e4e1;--teal:#0d9488;--teal-dark:#08746b;--orange:#e85d25;--red:#c93737;--card:#fff}*{box-sizing:border-box}body{margin:0;min-width:320px}button,input{font:inherit}.hidden{display:none!important}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#102a27;color:#d8eeea;padding:28px 18px;display:flex;flex-direction:column}.brand{font-weight:800;letter-spacing:-.04em;font-size:20px;color:#fff;margin:0 12px 42px}.brand small{display:block;color:#82b5ae;font:500 10px ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase;margin-top:7px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#a9c7c1;text-align:left;padding:12px;border-radius:8px;cursor:pointer;font-weight:600}.nav button:hover,.nav button.active{background:#1d4842;color:#fff}.side-foot{margin-top:auto;font:12px ui-monospace,monospace;color:#80aaa4;line-height:1.6}.main{padding:34px clamp(20px,4vw,58px);max-width:1500px;width:100%}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:28px}.eyebrow{font:600 11px ui-monospace,monospace;letter-spacing:.15em;text-transform:uppercase;color:var(--teal);margin:0 0 7px}.top h1{font-size:32px;letter-spacing:-.05em;margin:0}.top p{color:var(--muted);margin:9px 0 0}.outline{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:7px;cursor:pointer;font-weight:700}.outline:hover{border-color:var(--teal);color:var(--teal-dark)}.cards{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:14px;margin-bottom:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}.stat-label{font-size:12px;color:var(--muted);font-weight:700}.stat-value{font-size:30px;font-weight:800;letter-spacing:-.05em;margin-top:10px}.section{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.section-head h2{font-size:16px;margin:0;letter-spacing:-.02em}.section-head span{font-size:12px;color:var(--muted)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}th,td{text-align:left;padding:13px 20px;border-bottom:1px solid #edf2f1;white-space:nowrap}th{font:600 10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);background:#fbfdfc}tr:last-child td{border-bottom:0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#edf3f1;color:#53625f}.pill.good{background:#d9f4e5;color:#176b42}.pill.warn{background:#fff0d9;color:#9a5b00}.pill.bad{background:#ffe2e2;color:#a12e2e}.pill.blue{background:#dceefd;color:#1f5c8f}.login{min-height:100vh;display:grid;place-items:center;background:#102a27;padding:20px}.login-box{background:#fff;width:min(420px,100%);padding:34px;border-radius:12px}.login-box h1{margin:0;font-size:27px;letter-spacing:-.05em}.login-box p{color:var(--muted);font-size:14px;line-height:1.6}.field{display:grid;gap:7px;margin:18px 0}.field label{font-size:12px;font-weight:800;color:#38504b}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:7px;outline:none}.field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px #bcebe5}.primary{width:100%;padding:13px;border:0;border-radius:7px;background:var(--teal);color:#fff;font-weight:800;cursor:pointer}.primary:hover{background:var(--teal-dark)}.error{background:#fff0f0;color:var(--red);padding:10px;border-radius:7px;font-size:13px;margin:14px 0}.empty{padding:30px 20px;color:var(--muted);font-size:14px}.json{max-width:260px;overflow:hidden;text-overflow:ellipsis;color:#50706a}.row-action{border:0;background:none;color:var(--teal-dark);font-weight:800;cursor:pointer;padding:6px}.row-action:hover{text-decoration:underline}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{padding:16px;display:block}.brand{margin:0 0 14px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-foot{display:none}.main{padding:24px 16px}.cards{grid-template-columns:repeat(2,1fr)}.top h1{font-size:26px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div id="login" class="login"><form id="loginForm" class="login-box"><p class="eyebrow">GLANCE / PRIVATE OPS</p><h1>Admin Console</h1><p>管理任务队列、Widget 审核和 Worker 运行状态。</p><div id="loginError" class="error hidden" role="alert"></div><div class="field"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required></div><div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="primary" type="submit">登录控制台</button></form></div>
  <div id="app" class="shell hidden"><aside class="side"><div class="brand">Glance <small>Operations Console</small></div><nav class="nav" aria-label="后台导航"><button class="active" data-view="overview">Overview</button><button data-view="tasks">Task Center</button><button data-view="widgets">Widget Review</button></nav><div class="side-foot">Private surface<br>Session protected</div></aside><main class="main"><header class="top"><div><p class="eyebrow">SERVICE CONTROL PLANE</p><h1 id="title">运营概览</h1><p id="subtitle">任务、审核与 Worker 的实时摘要。</p></div><button id="logout" class="outline">退出登录</button></header><div id="content"></div></main></div>
  <script>
    const $=s=>document.querySelector(s), state={overview:null,tasks:[],widgets:[]}; let currentView='overview';
    const api=async(path,options={})=>{const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error?.message||'请求失败');return b.result};
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const count=(rows,statuses)=>rows.filter(x=>statuses.includes(x.status)).reduce((n,x)=>n+Number(x.count||0),0);
    const pill=s=>{const cls=['succeeded','completed','published','gray_release','test_passed'].includes(s)?'good':['failed','rejected','suspended'].includes(s)?'bad':['queued','claimed','running','manual_review'].includes(s)?'warn':'blue';return `<span class="pill ${cls}">${esc(s)}</span>`};
    function renderOverview(){const o=state.overview,t=o.tasks,w=o.widgets;$('#title').textContent='运营概览';$('#subtitle').textContent='任务、审核与 Worker 的实时摘要。每 10 秒自动刷新。';$('#content').innerHTML=`<div class="cards"><div class="card"><div class="stat-label">运行中任务</div><div class="stat-value">${count(t,['running','claimed'])}</div></div><div class="card"><div class="stat-label">待审核版本</div><div class="stat-value">${count(w,['manual_review'])}</div></div><div class="card"><div class="stat-label">失败任务</div><div class="stat-value">${count(t,['failed'])}</div></div><div class="card"><div class="stat-label">在线 Worker</div><div class="stat-value">${count(o.workers,['active'])}</div></div></div><div class="section"><div class="section-head"><h2>任务状态</h2><span>来自 D1 当前聚合</span></div><div class="table-wrap"><table><thead><tr><th>状态</th><th>数量</th><th>含义</th></tr></thead><tbody>${t.map(x=>`<tr><td>${pill(x.status)}</td><td>${x.count}</td><td>${esc({queued:'等待 Worker',claimed:'已领取',running:'处理中',succeeded:'已完成',failed:'失败',cancelled:'已取消'}[x.status]||'—')}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">暂无任务</td></tr>'}</tbody></table></div></div><div class="section"><div class="section-head"><h2>最近任务</h2><span>最近 100 条中的最新 10 条</span></div><div class="table-wrap"><table><thead><tr><th>任务</th><th>Widget</th><th>类型</th><th>状态</th><th>尝试</th><th>错误</th><th>结果</th></tr></thead><tbody>${state.tasks.slice(0,10).map(x=>`<tr><td class="mono">${esc(x.id).slice(0,22)}</td><td>${esc(x.widget_name||x.widget_id)}<br><span class="mono">${esc(x.command_id)}</span></td><td>${pill(x.type)}</td><td>${pill(x.status)}</td><td>${x.attempts}</td><td>${esc(x.error_code||'—')}</td><td class="json" title="${esc(JSON.stringify(x.result))}">${esc(x.result?JSON.stringify(x.result):'—')}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">暂无任务</td></tr>'}</tbody></table></div></div>`}
    function renderTasks(){ $('#title').textContent='Task Center';$('#subtitle').textContent='查看任务响应、产物和失败原因。';$('#content').innerHTML=`<div class="section"><div class="section-head"><h2>最近 100 个任务</h2><button class="row-action" onclick="load('tasks')">刷新</button></div><div class="table-wrap"><table><thead><tr><th>任务</th><th>Widget</th><th>类型</th><th>状态</th><th>尝试</th><th>错误</th><th>创建时间</th><th>结果</th></tr></thead><tbody>${state.tasks.map(x=>`<tr><td class="mono">${esc(x.id).slice(0,22)}</td><td>${esc(x.widget_name||x.widget_id)}<br><span class="mono">${esc(x.command_id)}</span></td><td>${pill(x.type)}</td><td>${pill(x.status)}</td><td>${x.attempts}</td><td>${esc(x.error_code||'—')}</td><td>${esc(new Date(x.created_at).toLocaleString())}</td><td class="json" title="${esc(JSON.stringify(x.result))}">${esc(x.result?JSON.stringify(x.result):'—')}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">暂无任务</td></tr>'}</tbody></table></div></div>`}
    function renderWidgets(){ $('#title').textContent='Widget Review';$('#subtitle').textContent='审核提交版本、查看 Manifest 并跟踪发布状态。';$('#content').innerHTML=`<div class="section"><div class="section-head"><h2>最近提交</h2><button class="row-action" onclick="load('widgets')">刷新</button></div><div class="table-wrap"><table><thead><tr><th>Widget</th><th>版本</th><th>作者</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${state.widgets.map(x=>`<tr><td><strong>${esc(x.name)}</strong><br><span class="mono">${esc(x.widget_id)}</span></td><td class="mono">v${esc(x.version)}</td><td>${esc(x.author)}</td><td>${pill(x.status)}</td><td>${esc(new Date(x.updated_at).toLocaleString())}</td><td>${x.status==='manual_review'||x.status==='test_passed'?`<button class="row-action" onclick="review('${esc(x.version_id)}','approve')">灰度发布</button><button class="row-action" onclick="review('${esc(x.version_id)}','reject')">拒绝</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">暂无提交</td></tr>'}</tbody></table></div></div>`}
    async function load(view){currentView=view;try{if(view==='overview'){const [overview,tasks]=await Promise.all([api('/api/admin/v2/overview'),api('/api/admin/v2/tasks')]);state.overview=overview;state.tasks=tasks;renderOverview()}if(view==='tasks'){state.tasks=await api('/api/admin/v2/tasks');renderTasks()}if(view==='widgets'){state.widgets=await api('/api/admin/v2/widgets');renderWidgets()}}catch(e){if(e.message==='Unauthorized'){showLogin()}else console.error(e)}}
    async function review(id,action){if(!confirm(action==='approve'?'确认将此版本灰度发布？':'确认拒绝此版本？'))return;try{await api('/api/admin/v2/widget-submissions/'+id+'/'+action,{method:'POST',body:JSON.stringify({note:'Admin Console action'})});await load('widgets')}catch(e){alert(e.message)}}
    function showLogin(){$('#login').classList.remove('hidden');$('#app').classList.add('hidden')};function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load('overview')}
    $('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginError').classList.add('hidden');try{await api('/api/admin/auth/login',{method:'POST',body:JSON.stringify({username:$('#username').value,password:$('#password').value})});showApp()}catch(x){$('#loginError').textContent=x.message;$('#loginError').classList.remove('hidden')}});
    $('#logout').addEventListener('click',async()=>{await api('/api/admin/auth/logout',{method:'POST'});showLogin()});document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');load(b.dataset.view)}));
    api('/api/admin/auth/me').then(showApp).catch(showLogin);setInterval(()=>{if(!$('#app').classList.contains('hidden'))load(currentView)},10000);
  </script>
</body>
</html>
