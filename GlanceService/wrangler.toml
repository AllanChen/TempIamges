name = "glance-service"
main = "src/index.ts"
compatibility_date = "2026-09-15"

[[d1_databases]]
binding = "DB"
database_name = "glance-service-db"
database_id = "1fbaa9ce-65b3-4255-a8eb-04bd2aa7b6bd"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "glance-service-assets"

[assets]
directory = "site"
binding = "ASSETS"

[vars]
PUBLIC_ORIGIN = "https://glance-service.allanchanni.workers.dev"
# Set ADMIN_PATH as a secret, e.g. "ops-7f3c9a2e". The admin UI is only served at that path.
# TEMPORARY: bypass worker token verification while the pull/heartbeat/result
# flow is being tested end-to-end. Remove this after auth is wired up.
WORKER_AUTH_DISABLED = "true"
