name = "glance-service"
main = "src/index.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "glance-service-db"
database_id = "1fbaa9ce-65b3-4255-a8eb-04bd2aa7b6bd"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "glance-service-assets"

[assets]
directory = "site"
binding = "ASSETS"

[vars]
# New accounts receive this many credits once; set to "0" for admin-only grants.
NEW_USER_CREDITS = "100"
# TODO(domain move): PUBLIC_ORIGIN also forms the developer OAuth redirect URI; switch it to
# "https://api.glancepreview.com" together with GOOGLE_REDIRECT_URI below once both new URIs
# are registered in the Google OAuth client.
PUBLIC_ORIGIN = "https://glance-service.allanchanni.workers.dev"
# TODO(domain move): switch to "https://glancepreview.com/auth/google/callback" only after
# adding it (and "https://api.glancepreview.com/api/v2/developer/auth/google/callback")
# to the Google OAuth client; the Worker route for the new host already exists.
GOOGLE_REDIRECT_URI = "https://glance.mcreator.ai/auth/google/callback"
# Set ADMIN_PATH as a secret, e.g. "ops-7f3c9a2e". The admin UI is only served at that path.
# Production tasks must be claimed by an authorized Widget Worker. The
# FLOW_TEST_TOKEN remains available for task-status checks, but cannot act as
# a legacy Worker and take jobs away from the local glance worker.
WORKER_AUTH_DISABLED = "false"
# Merchant/store IDs and all keys are configured with wrangler secret, never
# committed. Keep sales disabled in Admin until the Waffo account is approved.
WAFFO_ENVIRONMENT = "test"
# Temporary mock checkout for the owner's test account only. Remove after
# Pancake approval and merchant setup; no other account can create mock orders.
MOCK_CHECKOUT_USER_ID = "1"
