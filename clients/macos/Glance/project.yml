name: Glance
options:
  defaultConfig: Debug
  bundleIdPrefix: com.glance
  deploymentTarget:
    macOS: "12.3"
  xcodeVersion: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "12.3"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"

# Swift Package Manager 依赖配置
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.1"
  # 语法高亮（highlight.js 封装，离线可用），用于可编辑代码视图。
  Highlightr:
    url: https://github.com/raspu/Highlightr
    from: "2.1.0"
  # macOS ImageIO can decode WebP but does not provide a WebP encoder.
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode.git
    exactVersion: "1.6.0"

targets:
  Glance:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "*.bak"
      - path: Resources
        excludes:
          - WidgetDemos
        buildPhase: resources
      - path: Resources/WidgetDemos
        type: folder
        buildPhase: resources
      - path: LoadFailed.gif
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - package: Highlightr
      - package: libwebp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glance.app
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: Glance
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Glance.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Glance.entitlements

  # Mac App Store build: sandboxed, no Sparkle. Store-only code paths are
  # gated with `#if MAS`; the DMG target above is unchanged.
  Glance-MAS:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "*.bak"
          - "AppUpdater.swift"
      - path: Resources
        excludes:
          - WidgetDemos
        buildPhase: resources
      - path: Resources/WidgetDemos
        type: folder
        buildPhase: resources
      - path: LoadFailed.gif
        buildPhase: resources
    dependencies:
      - package: Highlightr
      - package: libwebp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glance.app
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: Glance
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MAS"
        CODE_SIGN_ENTITLEMENTS: Glance.MAS.entitlements
        # Sign in with Apple needs a provisioning profile, so the store build
        # signs with the team instead of ad hoc.
        DEVELOPMENT_TEAM: 4C8WK3Z8YZ
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # Share Info.plist with the DMG build, then strip what the store forbids
      # and add what it requires. Runs before code signing.
      - name: Adapt Info.plist for Mac App Store
        basedOnDependencyAnalysis: false
        script: |
          set -e
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          for key in SUAutomaticallyUpdate SUEnableAutomaticChecks SUFeedURL SUPublicEDKey SURequireSignedFeed SUVerifyUpdateBeforeExtraction NSAppleEventsUsageDescription; do
            /usr/libexec/PlistBuddy -c "Delete :$key" "$PLIST" 2>/dev/null || true
          done
          /usr/libexec/PlistBuddy -c "Delete :LSApplicationCategoryType" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationCategoryType string public.app-category.photography" "$PLIST"
