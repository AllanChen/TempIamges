[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glance-cli"
version = "0.1.0"
description = "Develop and run Glance widgets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Glance" }]
dependencies = []

[project.scripts]
glance = "glance_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
