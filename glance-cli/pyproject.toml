[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glance-cli"
dynamic = ["version"]
description = "Develop, test, publish and run Glance widgets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Allan", email = "allanchanni@gmail.com" }]
keywords = ["glance", "widget", "worker", "macos", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AllanChen/TempIamges"
Issues = "https://github.com/AllanChen/TempIamges/issues"
Source = "https://github.com/AllanChen/TempIamges/tree/main/glance-cli"

[project.scripts]
glance = "glance_cli.cli:main"

[tool.setuptools.dynamic]
# One place to bump the version: src/glance_cli/__init__.py.
version = { attr = "glance_cli.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
