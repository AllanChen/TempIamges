<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; font: 13px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #151514; color: #eae7e0; }
  h1 { margin: 0 0 12px; font-size: 20px; font-weight: 500; }
  p { color: #a19d94; margin: 0 0 16px; }
  button { width: 100%; height: 48px; border: 0; border-radius: 6px; background: #eae7e0; color: #0f0f0e; font: 500 14px -apple-system, sans-serif; cursor: pointer; }
  button:focus-visible { outline: 2px solid #eae7e0; outline-offset: 4px; }
  button:disabled { opacity: .6; cursor: default; }
  #status { margin-top: 16px; font-size: 12px; }
  .credit { font-size: 11px; color: #96918c; margin-top: 20px; }
  a { color: inherit; }
</style>
<h1>Glance 网站 · Shizuka 3.0</h1>
<p>Sumi 墨 / Washi 和纸<br>中英文 · 桌面 1440 / 移动端 390<br>在独立网站文件中生成，App UI 仅作参考</p>
<p><a href="https://www.figma.com/design/kWvE51F9IfI3oSN6ZoxeKw" target="_blank" rel="noreferrer">打开独立网站文件</a></p>
<button id="generate">生成网站 · 最新设计</button>
<p id="status" role="status" aria-live="polite">App 参考素材已打包，无需在目标文件中查找 App 图层。</p>
<p class="credit">Unslop by <a href="https://github.com/heydamir/unslop" target="_blank" rel="noreferrer">Damir Sokolovsky</a> · CC BY 4.0</p>
<script>
  const button = document.getElementById('generate');
  const status = document.getElementById('status');
  button.onclick = () => {
    button.disabled = true;
    status.textContent = 'Creating your website layouts…';
    parent.postMessage({ pluginMessage: { type: 'generate' } }, '*');
  };
  window.onmessage = event => {
    const message = event.data.pluginMessage;
    if (!message) return;
    if (message.type === 'mode' && message.editorType !== 'figma') {
      button.disabled = true;
      status.textContent = 'Press Shift+D for Design Mode, then run this plugin again.';
    }
    if (message.type === 'mode' && message.editorType === 'figma') {
      button.disabled = message.isAppReference;
      status.textContent = message.isAppReference
        ? '当前是 App UI 参考文件，请点击上方链接打开独立网站文件。'
        : '生成目标：' + message.documentName + '。再次运行会保留已有修改。';
    }
    if (message.type === 'done' || message.type === 'error') {
      button.disabled = false;
      status.textContent = message.message;
    }
  };
  parent.postMessage({ pluginMessage: { type: 'mode' } }, '*');
</script>
</html>
