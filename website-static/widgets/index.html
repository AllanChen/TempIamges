<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Glance — Widget Market</title>
  <style>
    :root{color-scheme:dark;--bg:#101114;--row:#181a1f;--row-hover:#20232a;--text:#e7e9ed;--muted:#969ba5;--accent:#c9a47d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding:26px 28px 56px}.hero{border-bottom:1px solid #ffffff18;padding-bottom:18px;margin-bottom:12px}.hero h1{font-size:24px;line-height:1.2;font-weight:500;letter-spacing:-.01em;margin:0}.grid{display:flex;flex-direction:column;gap:2px}.card{display:flex;align-items:center;gap:14px;background:var(--row);border:1px solid transparent;border-radius:5px;padding:12px 14px;min-height:92px;transition:background .12s,border-color .12s}.card:hover{background:var(--row-hover);border-color:#ffffff1c}.top{display:flex;align-items:center;gap:14px;flex:1;min-width:0}.icon{width:48px;height:48px;flex:0 0 48px;border-radius:8px;object-fit:cover;background:#0006;border:1px solid #ffffff18}.grow{flex:1;min-width:0}.title{display:flex;align-items:center;gap:10px}.title h2{font-size:14px;font-weight:600;margin:0}.version{font-size:11px;color:var(--muted);margin-top:2px}.pill{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#d8c2aa;background:#c9a47d1c;border-radius:3px;padding:2px 5px}.summary{color:#b4b8c0;margin:6px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.footer{display:flex;align-items:center;gap:14px;flex:0 0 auto;border:0;padding:0}.commands{font-size:11px;color:var(--muted);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;align-items:center;gap:10px;margin:0}.privacy{display:none}.install{border:1px solid #c9a47d66;border-radius:4px;background:#c9a47d;color:#171719;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}.install:hover{background:#dfb990}.install:disabled{cursor:default;opacity:.72}.notice,.error{border-radius:4px;padding:10px 12px;margin-bottom:12px}.notice{background:#c9a47d19;border:1px solid #c9a47d55;color:#e2c6a8}.error{background:#9e474720;border:1px solid #e48c8c55;color:#ffdede}.empty{color:#969ba5;padding:28px 14px;border:1px solid #ffffff16;border-radius:5px;text-align:center}@media(max-width:650px){.wrap{padding:20px 14px 40px}.card{align-items:flex-start;flex-wrap:wrap}.top{min-width:calc(100% - 0px)}.footer{margin-left:62px}.commands{max-width:calc(100vw - 180px)}}
  </style>
</head>
<body><main class="wrap"><header class="hero"><h1>Widget Market</h1></header><div id="message" aria-live="polite"></div><section id="catalog" class="grid" aria-label="Official Widgets"><div class="empty">Loading the official catalog…</div></section></main>
<script>
const API="https://api.mcreator.ai/api/glance/v2/widgets";const catalog=document.getElementById("catalog"),message=document.getElementById("message");
function bridge(id){const h=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.glanceWidgetMarket;if(!h)return false;h.postMessage({type:"installWidget",widgetID:id});return true}
function show(text,kind="notice"){message.innerHTML="";const el=document.createElement("div");el.className=kind;el.textContent=text;message.appendChild(el)}
function render(items){catalog.innerHTML="";if(!items.length){catalog.innerHTML='<div class="empty">No Widgets are currently available.</div>';return}items.forEach(w=>{const card=document.createElement("article");card.className="card";const commands=(w.commands||[]).map(c=>c.name).join(", ");card.innerHTML=`<div class="top"><img class="icon" alt="" src="${w.iconURL}"><div class="grow"><div class="title"><div><h2>${w.name}</h2><div class="version">Official by ${w.author} · v${w.version}</div></div><span class="pill">Cloud</span></div><p class="summary">${w.summary}</p></div></div><div class="footer"><div class="commands">${(w.commands||[]).length} Command${(w.commands||[]).length===1?"":"s"} · ${commands}</div><div class="actions"><div class="privacy">${w.privacy&&w.privacy.notice||"Cloud processing"}</div><button class="install" type="button">Install</button></div></div>`;card.querySelector("button").addEventListener("click",()=>{if(bridge(w.id)){card.querySelector("button").textContent="Installed";card.querySelector("button").disabled=true;show(`${w.name} is now available in Glance.`)}else show("Open this page inside Glance to install a Widget.")});catalog.appendChild(card)})}
fetch(API,{headers:{Accept:"application/json"}}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(b=>render(b.result&&b.result.widgets||[])).catch(()=>{catalog.innerHTML="";show("The Widget Market is temporarily unavailable. Try again in a moment.","error")});
</script></body></html>
